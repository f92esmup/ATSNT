# /etc/systemd/journald.conf.d/atsnt-quota.conf
#
# Quota configuration for systemd-journald on ATSNT production host.
# Caps total disk utilization of trading logs at 100 MB with automatic rotation,
# preventing host disk exhaustion on lightweight cloud VMs (e.g. e2-micro).

[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=100M
SystemKeepFree=500M
SystemMaxFileSize=10M
MaxRetentionSec=1month
