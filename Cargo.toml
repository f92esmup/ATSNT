[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/strategies",
    "crates/adapters",
    "crates/backtest",
    "crates/web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
# Internal workspace crates
domain = { path = "crates/domain" }
strategies = { path = "crates/strategies" }
adapters = { path = "crates/adapters" }
backtest = { path = "crates/backtest" }

# External foundational crates
tokio = { version = "1.40", features = ["full", "test-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1.36", features = ["maths"] }
rust_decimal_macros = "1.36"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parquet = { version = "53", default-features = false, features = ["arrow", "snap"] }
arrow = { version = "53", default-features = false }
arrow-schema = { version = "53" }
arrow-array = { version = "53" }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking", "json"] }
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
rayon = "1.10"
rand = "0.8"
ring = { version = "0.17", default-features = false }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

futures-util = "0.3"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
tokio-stream = { version = "0.1", features = ["sync"] }
